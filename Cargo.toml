[package]
name = "Particule_Simulation_4D"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "particule_simulation_4d"

[dependencies]
rayon = "1.12.0"
winit = "0.30"
wgpu = "30"
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard"] }
egui-wgpu = "0.36"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "engine"
harness = false

[lints.rust]
missing_docs = "warn"

[lints.clippy]
correctness = "deny"
perf = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

# Speed up the egui text raster in debug builds (no effect on compile time).
[profile.dev.package]
egui = { opt-level = 1 }
epaint = { opt-level = 1 }
