[package]
name = "Particule_Simulation_4D"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "particule_simulation_4d"

[dependencies]
gpui-kit = "0.7.0"
rayon = "1.12.0"
rustc-hash = "2.1.3"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "engine"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

# Speed up the gpui stack at runtime in debug builds (no effect on compile time).
# https://gpui-kit.com/versions/main/docs/installation/
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
